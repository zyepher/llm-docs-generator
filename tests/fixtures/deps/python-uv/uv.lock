version = 1
revision = 2
requires-python = ">=3.12"

[manifest]
members = [
    "acme-core",
    "acme-service",
]

[[package]]
name = "acme-core"
version = "0.1.0"
source = { editable = "packages/core" }
dependencies = [
    { name = "httpx" },
    { name = "internal-sdk" },
]

[[package]]
name = "acme-service"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "acme-core" },
    { name = "fastapi", extra = ["standard"] },
    { name = "pydantic-settings" },
]

[package.optional-dependencies]
redis = [
    { name = "redis" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[[package]]
name = "anyio"
version = "4.6.2.post1"
source = { registry = "https://pypi.org/simple" }
