name: Release

# Publishes the package to npm with provenance when a v* tag is pushed. The tag
# must equal "v" plus the package.json version, and the whole CI gate runs
# first. The only secret it needs is NPM_TOKEN.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  FORCE_COLOR: '0'
  NO_COLOR: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version; tag the release as v$version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Plugin bundle check
        run: npm run check:plugin

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
