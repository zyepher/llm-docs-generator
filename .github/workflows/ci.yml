name: CI

# Enforces the pre-merge gate on every supported platform and Node line:
# lint (Biome), format check (Prettier), type-check, build, and the full test
# suite. FORCE_COLOR is pinned to 0 so the suite is hermetic (ANSI never leaks
# into CLI output, which the assertions compare against).

on:
  push:
    branches: [main, 'v3/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: '0'
  NO_COLOR: '1'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
