name: Publish to npm

# Manual only: publishes a released tag to npm with provenance. The package is
# not on npm yet; run this when the owner decides to publish it, after adding
# an npm automation token as the NPM_TOKEN repository secret. Then lift the
# registry rule in scripts/check-plugin.ts and document the npm install.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, such as v3.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_COLOR: '0'
  NO_COLOR: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check that NPM_TOKEN is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not configured. Add an npm automation token as the repository secret NPM_TOKEN (Settings, Secrets and variables, Actions), then run this workflow again."
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version at that tag; publish v$version instead."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Plugin bundle check
        run: npm run check:plugin

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
